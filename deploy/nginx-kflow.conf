# KFlow — 可选的 nginx 前置层
#
# Django 的 runserver 是纯 Python 服务：每个 .css/.js 请求都要穿过 URL 解析、
# 中间件和一次 Python 层的读盘。本机访问感知不到，一到公网 RTT 就被放大成
# 明显的卡顿。这份配置把静态资源和上传物交给 nginx（sendfile + 零拷贝 + 内核
# 级缓存），动态请求才回源 Django。
#
# 用法（macOS Homebrew 为例）：
#   1. 把 PROJECT_ROOT 换成仓库绝对路径
#   2. cp deploy/nginx-kflow.conf /opt/homebrew/etc/nginx/servers/kflow.conf
#   3. nginx -t && nginx -s reload
# 之后仍用 http://<host>:8080 访问，Django 侧不需要任何改动。
#
# 可选：在 .env 加 XACCEL_MEDIA_PREFIX=/_protected_uploads，碎碎念视频/封面
# 改由 X-Accel-Redirect 交给 nginx 直发（Django 只做校验，不再搬运字节）。

upstream kflow_django {
    server 127.0.0.1:9000;
    keepalive 32;                 # 回源连接复用，省掉每请求一次握手
}

server {
    listen 8080;
    server_name _;

    # ── 压缩 ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;         # 太小的body压了也省不了多少，还浪费CPU
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml application/manifest+json;

    # ── 构建产物：内容带 ?v=<hash>，可以放心锁一年 ───────────────────────────
    location /static/ {
        alias PROJECT_ROOT/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── 站点根的裸文件（/favicon.svg 等）───────────────────────────────────
    location ~ ^/(?:favicon|robots|manifest|sitemap)\.(?:svg|ico|txt|json|xml)$ {
        root PROJECT_ROOT/static;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 上传物：只放行图片/视频。发布包（.zip 等）必须留回 Django 侧，
    #    它们走的是带鉴权的下载接口，nginx 直出等于绕过积分校验。────────────
    location ~ ^/uploads/.+\.(?:png|jpe?g|webp|gif|avif|svg|ico|mp4|webm|mov)$ {
        alias PROJECT_ROOT/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── 素材库（大体积视频/图片）───────────────────────────────────────────
    location /material/ {
        alias PROJECT_ROOT/Material/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        sendfile on;
        tcp_nopush on;
        access_log off;
    }

    # ── X-Accel-Redirect 内部转发（配合 .env 的 XACCEL_MEDIA_PREFIX）────────
    #    external 请求进不来，只有 Django 返回 X-Accel-Redirect 时 nginx 才会
    #    从这里发文件。Range/206/416 全部由 nginx 处理。
    location /_protected_uploads/ {
        internal;
        alias PROJECT_ROOT/uploads/;
    }

    # ── 页面根路径引用的静态资源（/theme.js、/murmurs.css、/favicon.ico）────
    #    页面 HTML 用根路径引用资源；之前这些全部回源 Django，每页几十个请求
    #    都占住 worker。排除 static/uploads/material 与 api，避免抢专属路由。
    location ~* ^/(?!static/|uploads/|material/|api/|_protected_uploads/)(?:.+/)?[^/]+\.(?:css|js|mjs|svg|ico|png|jpe?g|webp|gif|avif|woff2?|ttf|otf)$ {
        root PROJECT_ROOT/static;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── 其余全部回源 Django ─────────────────────────────────────────────────
    location / {
        proxy_pass http://kflow_django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # 配合 upstream keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 单层反代时 $proxy_add_x_forwarded_for 会把客户端自带的 XFF 原样透传，
        # 等于把真实 IP 的定义交给访客——按 IP 的限流会被随意伪造绕过。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;                 # 显影/生成接口可能跑很久

        # 大文件上传（分片上传、发布包）别在反代这里被截断
        client_max_body_size 256m;
        proxy_request_buffering off;
    }
}
