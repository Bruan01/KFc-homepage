<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KFlow 用户登录</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <span class="brand-badge">KF</span>
        <span>
          KFlow
          <span class="brand-sub">User Login</span>
        </span>
      </a>
      <nav class="nav">
        <a href="/">上一步</a>
      </nav>
    </div>
  </header>

  <main class="login-wrap container">
    <section class="login-card reveal">
      <h1 style="font-size:2rem; margin-top:0;">用户登录</h1>
      <p style="color:#667080; line-height:1.7; margin-top:0;">
        下载前需要登录。首次使用可直接填写账号密码，系统会自动创建用户。管理员账号也可在此登录。
      </p>
      <div id="notice"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="label" for="username">账号</label>
          <input class="input" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="label" for="email">邮箱</label>
          <input class="input" id="email" name="email" autocomplete="email" type="email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label class="label" for="password">密码</label>
          <input class="input" id="password" name="password" autocomplete="current-password" type="password" required />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; margin-top:8px;">登录并继续</button>
      </form>
      <!-- <div class="row" style="margin-top:10px;">
        <a class="btn" href="/admin/login" style="width:100%; text-align:center;">管理员请前往后台登录</a>
      </div> -->
      <p class="small" style="margin-top:14px;">提示：若账号不存在，会按你输入的密码自动注册。</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const notice = document.getElementById('notice');
    const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function setNotice(text, type = 'info') {
      if (!text) {
        notice.innerHTML = '';
        return;
      }
      notice.innerHTML = `<div class="notice ${type === 'error' ? 'notice-error' : 'notice-info'}">${text}</div>`;
    }

    async function checkUserLogin() {
      try {
        const res = await fetch('/api/user/me');
        const data = await res.json();
        if (data.loggedIn) {
          window.location.href = nextUrl;
        }
      } catch (e) {
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        username: form.username.value.trim(),
        email: form.email.value.trim().toLowerCase(),
        password: form.password.value,
      };
      if (!payload.username || !payload.password || !payload.email) {
        setNotice('请填写账号、邮箱和密码。', 'error');
        return;
      }
      if (!emailRe.test(payload.email)) {
        setNotice('邮箱格式不正确。', 'error');
        return;
      }
      setNotice('登录中...');
      try {
        const res = await fetch('/api/user/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const errMsg = String(data.error || '').toLowerCase();
          if (errMsg.includes('email already bound')) {
            throw new Error('该邮箱已被其他账号绑定。');
          }
          if (errMsg.includes('email does not match this account')) {
            throw new Error('邮箱与该账号不匹配，请检查后重试。');
          }
          throw new Error(data.error || '登录失败');
        }
        if (data.already_registered) {
          setNotice('该账号已注册过，已为你登录。');
          setTimeout(() => {
            window.location.href = nextUrl;
          }, 600);
          return;
        }
        window.location.href = nextUrl;
      } catch (err) {
        setNotice(`登录失败：${err.message}`, 'error');
      }
    });

    checkUserLogin();
  </script>
</body>
</html>
