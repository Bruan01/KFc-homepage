<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KFlow | 用户登录</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <span class="brand-badge">KF</span>
        <span>
          KFlow
          <span class="brand-sub">User Login</span>
        </span>
      </a>
      <nav class="nav">
        <a href="/">主页</a>
        <a href="/agnes-chat">Agnes Chat</a>
      </nav>
    </div>
  </header>

  <main class="login-wrap container">
    <section class="login-card reveal">
      <h1 style="font-size:2rem; margin-top:0;">用户登录</h1>
      <p style="color:#667080; line-height:1.7; margin-top:0;">
        输入用户名、邮箱和密码后即可登录。如果该用户名首次出现，系统会自动创建账号并写入当前邮箱。
      </p>
      <div id="notice"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="label" for="username">用户名</label>
          <input class="input" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="label" for="email">邮箱</label>
          <input class="input" id="email" name="email" autocomplete="email" type="email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label class="label" for="password">密码</label>
          <input class="input" id="password" name="password" autocomplete="current-password" type="password" required />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; margin-top:8px;">登录</button>
      </form>
      <p class="small" style="margin-top:14px;">
        登录成功后会回跳到你进入登录页之前的地址；如果没有 next 参数，则返回首页。
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const notice = document.getElementById('notice');
    const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function setNotice(text, type = 'info') {
      if (!text) {
        notice.innerHTML = '';
        return;
      }
      const css = type === 'error' ? 'notice-error' : 'notice-info';
      notice.innerHTML = `<div class="notice ${css}">${text}</div>`;
    }

    async function checkUserLogin() {
      try {
        const res = await fetch('/api/user/me', { credentials: 'same-origin' });
        const data = await res.json();
        if (data.loggedIn) {
          window.location.href = nextUrl;
        }
      } catch {
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        username: form.username.value.trim(),
        email: form.email.value.trim().toLowerCase(),
        password: form.password.value,
      };

      if (!payload.username || !payload.password || !payload.email) {
        setNotice('请完整填写用户名、邮箱和密码。', 'error');
        return;
      }
      if (!emailRe.test(payload.email)) {
        setNotice('邮箱格式不正确。', 'error');
        return;
      }

      setNotice('登录中...');
      try {
        const res = await fetch('/api/user/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const errMsg = String(data.error || '').toLowerCase();
          if (errMsg.includes('email already bound')) {
            throw new Error('该邮箱已经绑定到其他账号。');
          }
          if (errMsg.includes('email does not match this account')) {
            throw new Error('该邮箱与当前用户名不匹配。');
          }
          throw new Error(data.error || '登录失败');
        }
        window.location.href = nextUrl;
      } catch (error) {
        setNotice(`登录失败：${error.message}`, 'error');
      }
    });

    checkUserLogin();
  </script>
</body>
</html>
