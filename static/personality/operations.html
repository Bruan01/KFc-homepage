<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运行与反馈 · 心映</title><link rel="stylesheet" href="/static/personality/app.css"><script src="/csrf.js" defer></script><script src="/static/personality/admin-auth.js" defer></script><script src="/static/personality/operations.js" defer></script><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin-shell.css"><script src="/admin-shell.js" data-title="心映运行与反馈" data-active="personality" defer></script></head>
<body><header class="app-header"><a class="app-brand" href="/personality">心映 <small>管理工作台</small></a><nav><a href="/admin">KFlow 后台</a><a href="/personality">用户入口</a></nav></header>
<main class="admin-main operations-main">
<p class="eyebrow">让每一次探索，都有着落</p><div class="row"><h1>运行与反馈</h1><button id="refresh-operations" class="secondary" type="button">刷新检查</button></div>
<nav class="personality-admin-nav" aria-label="心映管理"><a href="/admin/personality">角色库与采集</a><a href="/admin/personality/settings">AI 模型服务</a><a href="/admin/personality/analysis">分析记录</a><a aria-current="page" href="/admin/personality/operations">运行与反馈</a></nav>
<p id="admin-status" role="status" aria-live="polite"></p>
<section class="admin-panel" aria-labelledby="readiness-title"><div class="row"><h2 id="readiness-title">开放前自检</h2><strong id="readiness-result">正在检查…</strong></div><p class="quiet" id="operations-checked"></p><div id="readiness-checks" class="readiness-checks"></div><p class="admin-note">这里汇总完整服务条件。只有已保存配置的连接检查通过，AI 项才会就绪；刷新本页不会调用模型。</p></section>
<section class="admin-panel" aria-labelledby="alerts-title"><div class="row"><h2 id="alerts-title">需要留意的任务</h2><span id="alert-count" class="quiet"></span></div><p class="admin-note">用户已收到回答保存提示，排查与处理留在后台。任务恢复后会自动归档；“已知悉”只记录处理状态。</p><div id="operations-alerts" class="operations-list"></div></section>
<section class="admin-panel" aria-labelledby="feedback-title"><div class="row"><h2 id="feedback-title">题目理解反馈</h2><span id="feedback-count" class="quiet"></span></div><p class="admin-note">按题目、版本和题面合并展示，不附带用户作答。优先检查被反复反馈的题目。</p><div id="question-feedback-list" class="operations-list"></div></section>
</main></body></html>
