<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分析过程 · 心映</title><link rel="stylesheet" href="/static/personality/app.css"><link rel="stylesheet" href="/static/personality/analysis.css?v=result-list-v3"><script src="/static/personality/analysis.js?v=result-list-v3" defer></script><script src="/static/personality/operations-badge.js" defer></script><script src="/admin-shell.js" data-title="心映分析记录" data-active="personality" defer></script></head><body>
<header class="app-header"><a class="app-brand" href="/personality">心映 <small>分析记录</small></a><nav><a id="back-link" href="/personality">返回探索记录</a><a id="admin-back" href="/admin/personality" hidden>角色库与采集</a><a href="/admin/personality/operations" data-operations-link hidden>运行与反馈</a></nav></header>
<main class="admin-main trace-main"><p class="eyebrow">每一步，都有据可查</p><div class="row"><h1>分析过程</h1><button id="refresh" class="secondary" type="button">刷新记录</button></div><nav id="trace-admin-nav" class="personality-admin-nav" aria-label="心映管理" hidden><a href="/admin/personality">角色库与采集</a><a href="/admin/personality/settings">AI 模型服务</a><a aria-current="page" href="/admin/personality/analysis">分析记录</a><a href="/admin/personality/operations" data-operations-link>运行与反馈</a></nav><p class="trace-note">查看实际发出的消息、模型返回和处理状态。记录保留 30 天，仅本人和主管理员可访问。</p><p id="trace-status" role="status"></p>
<section id="report-picker" class="admin-panel" hidden><div class="row"><h2>测评记录</h2><span id="report-count" class="trace-meta"></span></div><p class="trace-note">先查看人格与角色结果，点击记录可查看分析过程。最多展示最近 40 份。</p><form id="search-form" class="trace-search"><label for="search">用户名或档案编号<input id="search" autocomplete="off" placeholder="输入用户名或完整档案编号"></label><button class="primary" type="submit">查找</button></form><div class="trace-list-scroll" tabindex="0" role="region" aria-label="测评记录列表，窄屏可横向滚动"><div class="trace-list-head" aria-hidden="true"><span>用户 / 档案编号</span><span>MBTI</span><span>匹配角色</span><span>所属作品</span><span>状态</span><span>创建时间</span><span>调用</span></div><div id="report-list"></div></div></section>
<section id="trace-summary" class="admin-panel" hidden><h2 id="summary-title">当前档案</h2><div id="summary-result"></div><p id="summary-text"></p><p id="trace-empty"></p><ol id="job-list" class="trace-jobs"></ol></section><section id="call-list" aria-label="模型调用记录"></section></main></body></html>
