<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心映 · AI 模型服务</title><link rel="stylesheet" href="/static/personality/app.css"><script src="/csrf.js" defer></script><script src="/static/personality/admin-auth.js" defer></script><script src="/static/personality/admin-model.js" defer></script></head>
<body>
<header class="app-header"><a class="app-brand" href="/personality">心映 <small>管理工作台</small></a><nav><a href="/admin">KFlow 后台</a><a href="/personality">用户入口</a></nav></header>
<main class="admin-main model-settings-main">
<h1>AI 模型服务</h1>
<nav class="personality-admin-nav" aria-label="心映管理"><a href="/admin/personality">角色库与采集</a><a aria-current="page" href="/admin/personality/settings">AI 模型服务</a></nav>
<p id="admin-status" class="service-state" role="status" aria-live="polite"></p>
<section class="admin-panel"><h2>连接配置</h2>
<form id="settings-form" class="model-config-form">
<div class="admin-form model-basic-fields">
<label>API 地址<input name="base_url" type="url" required placeholder="https://服务地址/v1"></label>
<label>模型名称<input name="model" required autocomplete="off" list="model-options" placeholder="填写服务支持的模型 ID"><datalist id="model-options"></datalist></label>
<label>API Key<input name="api_key" type="password" autocomplete="new-password" placeholder="填写服务密钥"></label>
<label>每日每人报告上限<input name="daily_reports_per_user" type="number" required min="1" max="50"><span class="field-note">限制每位用户每天生成报告的次数。</span></label>
</div>
<label class="model-enable"><input type="checkbox" name="ai_enabled">启用 AI 分析</label>
<details class="model-advanced"><summary>高级设置</summary><div class="admin-form">
<label>请求超时（秒）<input name="timeout_seconds" type="number" min="10" max="180"></label>
<label>输出 token 上限<input name="max_output_tokens" type="number" min="0" max="32000"><span class="field-note">0 表示使用服务默认值。</span></label>
<label>输出上限参数<select name="token_parameter"><option value="max_tokens">max_tokens</option><option value="max_completion_tokens">max_completion_tokens</option><option value="none">不发送</option></select></label>
<label class="check wide"><input type="checkbox" name="enabled">允许创建新测评（全站）</label>
<p class="admin-note wide">维护时可关闭所有人的新测评入口，已有档案仍可查看；与每人每天的额度分别控制。</p>
<label class="check wide"><input type="checkbox" name="clear_api_key">清除已保存的密钥</label>
<label class="check wide"><input type="checkbox" name="evidence_enabled">资料不足时自动联网补证据</label>
<label class="wide">DeepSeek 搜索密钥（选填）<input name="evidence_api_key" type="password" autocomplete="new-password" placeholder="使用 DeepSeek 官方文本接口时可留空复用主密钥"><span class="field-note">其它文本服务可单独填写 DeepSeek 搜索密钥。仅补证据时调用，结果会缓存。</span></label>
<label class="check wide"><input type="checkbox" name="clear_evidence_api_key">清除单独保存的搜索密钥</label>
</div></details>
<div class="model-form-actions"><button class="primary" type="submit">保存并检查连接</button><button id="load-models" class="secondary" type="button">读取模型列表</button><span class="admin-note">密钥加密保存，留空保留原密钥。</span></div>
</form></section>
<section class="admin-panel" aria-labelledby="saved-config-title"><div class="row"><h2 id="saved-config-title">已保存的服务</h2><button id="test-provider" class="secondary" type="button" disabled>重新检查连接</button></div>
<p id="saved-config-empty" class="admin-note">正在读取配置…</p>
<div id="saved-config-list" class="saved-config-list" hidden aria-live="polite"></div>
<p id="worker-state" class="admin-note model-worker-state"></p>
</section></main></body></html>
